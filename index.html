<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Autocortex AI — context intelligence for complex workflows and enterprise data.">
    <title>Autocortex AI | Context Intelligence</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0d1117;
            color: #c9d1d9;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 24px;
        }
        .container {
            text-align: center;
            width: 100%;
            max-width: 600px;
            padding: 40px 28px;
            background-color: #161b22;
            border-radius: 12px;
            border: 1px solid #30363d;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
        }
        h1 { color: #58a6ff; font-size: clamp(2rem, 7vw, 2.5rem); margin: 0 0 8px; }
        h2 { color: #8b949e; font-size: 1.1rem; font-weight: normal; margin: 0 0 25px; }
        p { line-height: 1.7; font-size: 1.05rem; color: #c9d1d9; }
        footer { margin-top: 28px; color: #8b949e; font-size: .9rem; }
    </style>
</head>
<body>
    <main class="container">
        <h1>Autocortex AI</h1>
        <h2>Next-Gen Context Intelligence Platform</h2>
        <p>Harnessing large-context reasoning to analyze complex workflows and enterprise data at scale. Powered by Anthropic Claude models.</p>
        <footer>Building a smarter way to work with context.</footer>
    </main>
</body>
</html>
